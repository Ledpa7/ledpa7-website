<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="aid_gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <filter id="aid_glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.3" />
        </filter>
    </defs>
    <!-- Background Rounded Square Badge -->
    <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#aid_gold_grad)" filter="url(#aid_glow)" />
    
    <!-- Shield Silhouette in #181508 -->
    <path d="M256 128 L376 172 C376 272 256 364 256 364 C256 364 136 272 136 172 Z" fill="#181508" />
    
    <!-- Verified Checkmark in Gold Gradient -->
    <path d="M214 246 L244 276 L302 214" fill="none" stroke="url(#aid_gold_grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>
